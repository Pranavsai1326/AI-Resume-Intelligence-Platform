name: CI

# Phase 9I: the gates this project has claimed since Phase 8 (ruff, mypy, pytest, eslint,
# tsc, vitest, next build) finally run automatically on every push/PR, not just locally.
# No secrets are required - the suite runs entirely against NullLLMProvider/no-Redis defaults,
# same as any contributor's machine.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e ".[dev]"

      - name: Install Playwright's Chromium
        run: python -m playwright install --with-deps chromium

      - name: ruff
        run: python -m ruff check app tests

      - name: mypy
        run: python -m mypy app

      - name: pytest
        run: python -m pytest tests -q

      - name: pip-audit
        run: python -m pip_audit --skip-editable
        continue-on-error: true # advisory: findings are triaged manually, not a merge blocker yet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: vitest
        run: npm run test

      - name: next build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true # 3 known high-severity transitive findings, tracked - see PROJECT_STATUS.md
