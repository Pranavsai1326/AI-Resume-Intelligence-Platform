[project]
name = "resume-intelligence-backend"
version = "0.1.0"
description = "AI Resume Intelligence Platform - accountless, zero-persistence backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "python-multipart>=0.0.20",
    "pdfplumber>=0.11",
    "pypdf>=6.0",
    "python-docx>=1.1",
    "defusedxml>=0.7",
    "chardet>=5.2",
    "fastembed>=0.7",
]

[project.optional-dependencies]
redis = ["redis>=5.2"]
dev = [
    "pytest>=8.3",
    "reportlab>=4.2",  # test fixture generation only - never a runtime dependency
    "types-defusedxml>=0.7",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "redis: integration tests that require a running Redis server (skipped when unavailable)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "RUF"]
ignore = [
    "S101",
    # Resume text and date-range parsing deliberately matches Unicode en/em dashes ("2020 – 2021")
    # alongside the hyphen - these are not accidental confusable characters.
    "RUF001",
    # Kept as classic typing.Generic[T]/TypeVar rather than PEP 695 syntax: UP046 is about
    # Pydantic v2 compatibility for model classes, UP047 keeps plain generic functions
    # consistent with those same classes within a module (app.documents.heading_split mixes
    # a generic dataclass and generic functions over the same type parameter).
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
# File()/Form()/Depends() as argument defaults is the FastAPI-idiomatic dependency-injection
# pattern, not the mutable-default-argument bug B008 otherwise warns about.
"app/api/v1/*.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
